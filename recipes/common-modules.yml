---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: files
    files:
      # copies `files/milos/*` (* means everything inside it) into your image's root folder `/`
      - source: milos
        destination: /
      # copies `files/my-image/usr/*` to `/usr/` inside the image
      # - source: my-image/usr
      #   destination: /usr

  - type: justfiles
    # validate: true
    install: true
    # By default, the module will import all files with names ending in .just from files/justfiles/.
    include:
      - milos
    #   - gnome/monitors.just
    #   - shared/flatpak/fix-theming.just
    #   - justfile1.just

  - type: dnf
    repos:
      nonfree: rpmfusion
      files:
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
      keys:
        - https://linux.teamviewer.com/pubkey/currentkey.asc
    install:
      packages:
        - cockpit
        - cockpit-files
        - cockpit-machines
        - cockpit-podman

        - mullvad-vpn
        - mullvad-browser

        - gparted
        - wireshark

        - gnome-shell-theme-yaru  # Yaru GNOME Shell Theme
        - yaru-icon-theme         # Yaru icon theme
        - yaru-sound-theme        # Yaru sound theme
        - yaru-theme              # Ubuntu community theme yaru

        - https://download.teamviewer.com/download/linux/teamviewer.x86_64.rpm

  - type: script
    scripts:
      - virtualbox.sh
    snippets:
      - "mkdir -pv -m 0754 /etc/milos-signed-autorebase"
      - "flatpak remote-modify --system --default-branch=stable flathub"
      # - 'dnf install -y "$( curl -sL https://api.github.com/repos/Tibixdev/winboat/releases/latest | grep -wo "https.*x86_64.rpm\|https.*amd64.rpm" )"'

  - type: systemd
    system:
      enabled:
        - milos-signed-autorebase.service
        - milos-config-system.service
        - tailscaled.service
        - podman.socket
        - docker.socket
        - cockpit.socket
    #   disabled:
    #     - flatpak-system-update.timer
    user:
      enabled:
        - milos-config-user.service
        - podman.socket
    #   disabled:
    #     - flatpak-user-update.timer

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - scope: system
        repo:
          title: Flathub (system)
        install: # system flatpaks we want all users to have and not remove
          - org.gtk.Gtk3theme.Yaru
          - org.gtk.Gtk3theme.Yaru-Yellow
          - org.gtk.Gtk3theme.Yaru-Yellow-light
