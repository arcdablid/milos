  - type: systemd
    # this example disables automatic flatpak updates and enables a custom service unit for all users
    system:
      enabled:
        - milos-config-system.service
        - milos-signed-autorebase.service
        - milos-system-autoclean.timer
        - tailscaled.service
        - podman.socket
        - docker.socket
        - cockpit.socket
    #   disabled:
    #     - flatpak-system-update.timer
    user:
      enabled:
        - milos-config-user.service
    #   disabled:
    #     - flatpak-user-update.timer
